name: Deploy static site to GitHub Pages

# brandivibe.com served from GitHub Pages.
#
# Builds Next.js with NEXT_BUILD_TARGET=static (output: "export") into out/
# and deploys it. Triggered on every main-branch push that touches site source
# — including article commits from the /admin panel (src/data/articles.json +
# content/journal/*.mdx), which go live within ~3 minutes.
#
# PREREQUISITE (one-time, done): repo Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "mjstudio/src/**"
      - "mjstudio/public/**"
      - "mjstudio/content/**"
      - "mjstudio/package.json"
      - "mjstudio/package-lock.json"
      - "mjstudio/next.config.ts"
      - ".github/workflows/deploy-static.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mjstudio
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mjstudio/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build static site
        env:
          NEXT_BUILD_TARGET: static
        run: npx next build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Self-enable Pages with the GitHub Actions build type so the
          # repo doesn't need a manual Settings → Pages flip first.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mjstudio/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
